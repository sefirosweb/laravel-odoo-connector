name: tests

on:
  push:
    branches: [13.x]
  pull_request:
    branches: [13.x]

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Integration tests auto-skip when ODOO_* env vars are absent; the
      # Feature suite runs unconditionally. To enable Integration in CI set
      # ODOO_HOST / ODOO_DB / ODOO_USERNAME / ODOO_PASSWORD as repository
      # secrets and expose them in the `env:` block of this step.
      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
